<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Running Coach</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f5f7fb;--ink:#172033;--muted:#718096;--blue:#2563eb;--green:#16a34a;--orange:#f97316;--card:#fff;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.app{max-width:720px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.05em}.sub{font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0 0 10px}h2{font-size:25px}h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em}.section{margin:22px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 6px 20px #1e293b08}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;border-radius:24px;padding:22px}.hero .muted{color:#dbeafe}.muted{color:var(--muted)}.coach{font-size:17px;line-height:1.5;white-space:pre-line}.btn{background:var(--blue);color:#fff;border-radius:13px;padding:12px 15px;font-weight:800}.btn.secondary{background:#eaf0ff;color:#1d4ed8}.btn.ghost{background:transparent;color:var(--blue);padding:6px}.btn.warn{background:#fff1e8;color:#c2410c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:#f8fafc;border-radius:14px;padding:12px}.metric b{display:block;font-size:20px}.metric span{color:var(--muted);font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}.nav button{background:none;padding:12px 10px;color:var(--muted);font-size:11px;min-width:68px}.nav button.active{color:var(--blue);font-weight:900}.nav span{display:block;font-size:20px;margin-bottom:3px}.upload{border:2px dashed #93c5fd;border-radius:18px;padding:20px;text-align:center;background:#eff6ff}.upload input{display:none}.preview{max-width:100%;max-height:330px;border-radius:14px;margin:12px auto;display:block}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input,.field select,.chatinput{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:#fff}.range{width:100%}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{padding:9px 12px;border-radius:10px;background:#e5e7eb;color:#374151}.tabs button.on{background:#172554;color:#fff}.activity{cursor:pointer}.tag{display:inline-block;background:#ecfdf5;color:#15803d;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:800}.danger{background:#fff1f2;color:#be123c;padding:13px;border-radius:13px}.bar{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}canvas{width:100%;height:180px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:390px;width:100%;background:#fff;padding:25px;border-radius:24px;box-shadow:0 15px 45px #17255418}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 15px;border-radius:12px;z-index:10;font-size:13px}
</style></head>
<body>
<div id="login" class="login"><div class="loginbox"><div class="sub">PERSONAL RUNNING COACH</div><h1>MY RUNNING COACH</h1><p class="muted">Masuk dulu. Kita lihat latihanmu.</p><div class="field"><label>Kode akses</label><input id="code" type="password" placeholder="Masukkan kode"></div><button class="btn" style="width:100%" onclick="login()">Masuk</button><p id="loginerr" class="danger hidden" style="margin-top:12px">Kode salah.</p></div></div>
<div id="app" class="app hidden"><div class="top"><div><div class="brand">MY RUNNING COACH</div><div class="sub" id="todayLabel"></div></div><button class="btn ghost" onclick="logout()">Keluar</button></div><main id="main"></main></div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='prc_runs_v1', SET='prc_settings_v1';let runs=[],settings={goal:'Konsisten lari',days:3},tab='home',selected=null,ocrText='';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function login(){if($('code').value==='ucup6767'){sessionStorage.ok='1';$('login').classList.add('hidden');$('app').classList.remove('hidden');init()}else $('loginerr').classList.remove('hidden')};function logout(){sessionStorage.removeItem('ok');location.reload()}
function init(){runs=JSON.parse(localStorage.getItem(KEY)||'[]');settings=JSON.parse(localStorage.getItem(SET)||'{}');settings.goal??='Konsisten lari';settings.days??=3;$('todayLabel').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});render()}
function save(){localStorage.setItem(KEY,JSON.stringify(runs));localStorage.setItem(SET,JSON.stringify(settings))}function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function paceMin(r){if(r.pace)return r.pace;return r.distance&&r.duration? r.duration/r.distance:null}function paceText(x){if(x==null)return '—';let m=Math.floor(x),s=Math.round((x-m)*60);if(s===60){m++;s=0}return `${m}:${String(s).padStart(2,'0')}/km`}function num(x){let n=parseFloat(String(x||'').replace(',','.').replace(/[^\d.]/g,''));return isNaN(n)?null:n}
function latest(){return runs[0]}function daysAgo(date){let d=new Date(date);return Math.max(0,Math.floor((Date.now()-d)/86400000))}function dateLabel(d){return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function recovery(){return {energy:+($('energy')?.value||7),legs:$('legs')?.value||'Normal',body:$('body')?.value||'Normal',sleep:$('sleep')?.value||'Cukup',sore:$('sore')?.value||'Tidak ada'}}
function analyzeLoad(){let recent=runs.filter(r=>Date.now()-new Date(r.date)<7*864e5);let km=recent.reduce((a,r)=>a+(r.distance||0),0);let hard=recent.filter(r=>r.type==='Interval'||r.type==='Tempo'||(r.hr&&r.hr>=165)).length;return {km,hard,recent}}
function daily(){let rec=recovery(),load=analyzeLoad(),last=latest();if(rec.energy<=3||['Berat','Capek'].includes(rec.legs)||['Berat','Capek'].includes(rec.body)||['Sedang','Berat'].includes(rec.sore))return {act:'Recovery / Rest',dur:'20–30 min',int:'Very easy',target:'Jalan santai atau mobility',note:'Hari ini jangan dipaksa. Badanmu lagi minta recovery. Kalau ada nyeri tajam, stop dulu.'};if(load.hard>=2)return {act:'Easy Run',dur:'25–35 min',int:'Easy',target:'Masih bisa ngobrol',note:'Dua latihanmu sudah cukup berat minggu ini. Hari ini tahan ego, cari lari yang ringan.'};if(last&&daysAgo(last.date)<1)return {act:'Rest / Mobility',dur:'15–20 min',int:'Easy',target:'Gerak ringan',note:'Lari terakhir masih dekat. Besok baru kita lihat kaki dan energimu.'};if(settings.goal==='Meningkatkan pace'&&rec.energy>=8)return {act:'Tempo ringan',dur:'30–40 min',int:'Controlled',target:'Sedikit menantang, bukan sprint',note:'Badanmu kelihatan siap. Tetap terkontrol—jangan berubah jadi lomba.'};return {act:'Easy Run',dur:'30–40 min',int:'Easy',target:'Conversational pace',note:'Kalau napas mulai berat, turunin pace. Hari ini kita cari konsistensi, bukan PR.'}}
function home(){let d=daily(),r=latest();return `<div class="hero"><div class="sub muted">TODAY'S COACHING</div><h2>${d.act}.</h2><p class="coach">${d.note}</p></div><div class="section"><h3>Today's plan</h3><div class="card"><div class="grid"><div class="metric"><span>Activity</span><b>${d.act}</b></div><div class="metric"><span>Duration</span><b>${d.dur}</b></div><div class="metric"><span>Intensity</span><b>${d.int}</b></div><div class="metric"><span>Target</span><b>${d.target}</b></div></div></div></div><div class="section"><h3>How do you feel today?</h3>${feelForm()}</div><div class="section"><h3>Latest run</h3>${r?activity(r):'<div class="card muted">Belum ada lari yang masuk. Upload screenshot pertamamu.</div>'}</div>`}
function feelForm(){return `<div class="card"><div class="field"><label>Energy: <b id="energyVal">7</b>/10</label><input id="energy" class="range" type="range" min="1" max="10" value="7" oninput="energyVal.textContent=this.value;renderHomeOnly()"></div><div class="field"><label>Kaki</label><select id="legs" onchange="renderHomeOnly()"><option>Ringan</option><option selected>Normal</option><option>Berat</option></select></div><div class="field"><label>Badan</label><select id="body" onchange="renderHomeOnly()"><option>Fresh</option><option selected>Normal</option><option>Capek</option></select></div><div class="field"><label>Tidur</label><select id="sleep"><option>Kurang</option><option selected>Cukup</option><option>Bagus</option></select></div><div class="field"><label>Soreness</label><select id="sore" onchange="renderHomeOnly()"><option selected>Tidak ada</option><option>Ringan</option><option>Sedang</option><option>Berat</option></select></div></div>`}
function renderHomeOnly(){let h=document.querySelector('.hero');if(!h)return;let d=daily();h.querySelector('h2').textContent=d.act+'.';h.querySelector('.coach').textContent=d.note;let ms=document.querySelectorAll('.metric b');if(ms.length>=4){ms[0].textContent=d.act;ms[1].textContent=d.dur;ms[2].textContent=d.int;ms[3].textContent=d.target}}
function upload(){return `<div class="section"><h2>Upload Strava Screenshot</h2><p class="muted">OCR jalan di browser. Hasil bacaan tetap perlu kamu cek.</p><div class="upload"><label for="file" class="btn">+ Upload Strava Screenshot</label><input id="file" type="file" accept="image/png,image/jpeg" onchange="previewFile(event)"><div id="previewBox"></div></div><div id="ocrBox"></div></div>`}
function previewFile(e){let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f);$('previewBox').innerHTML=`<img class="preview" src="${url}"><button class="btn" onclick="runOCR()">Analyze My Run</button>`;window.currentFile=f}
async function runOCR(){if(!window.currentFile)return;let box=$('ocrBox');box.innerHTML='<div class="card">Lagi baca screenshot… jangan tutup halaman dulu.</div>';try{let res=await Tesseract.recognize(window.currentFile,'eng');ocrText=res.data.text;let d=extractRunData(ocrText);box.innerHTML=editData(d)}catch(e){box.innerHTML='<div class="danger">OCR gagal. Kamu tetap bisa isi data manual di bawah.</div>'+editData({})}}
function extractRunData(t){let x=t.replace(/\n/g,' '),d={raw:t};let dist=x.match(/(\d+[\.,]?\d*)\s*(km|mi)\b/i),time=x.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/),hr=x.match(/(?:heart rate|avg heart rate|average heart rate|hr)[^\d]*(\d{2,3})/i),elev=x.match(/(?:elevation|elev gain)[^\d]*(\d+[\.,]?\d*)/i),cal=x.match(/(?:calories|kcal)[^\d]*(\d+)/i),cad=x.match(/(?:cadence)[^\d]*(\d+)/i),pace=x.match(/(?:pace|avg pace|average pace)[^\d]*(\d+):(\d{2})/i);if(dist)d.distance=num(dist[1])*(/mi/i.test(dist[2])?1.60934:1);if(time)d.duration=(+(time[1])*60)+(+time[2])+(time[3]?+time[3]*60:0);if(pace)d.pace=+pace[1]+(+pace[2]/60);if(!d.pace&&d.distance&&d.duration)d.pace=d.duration/60/d.distance;if(hr)d.hr=num(hr[1]);if(elev)d.elevation=num(elev[1]);if(cal)d.calories=num(cal[1]);if(cad)d.cadence=num(cad[1]);return d}
function editData(d){return `<div class="card"><h3>Check your run</h3><div class="grid"><div class="field"><label>Date</label><input id="fdate" type="date" value="${d.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Distance (km)</label><input id="fdistance" value="${d.distance??''}"></div><div class="field"><label>Duration (minutes)</label><input id="fduration" value="${d.duration?Math.round(d.duration*100)/100:''}"></div><div class="field"><label>Pace (min/km)</label><input id="fpace" placeholder="6:14" value="${d.pace?paceText(d.pace).replace('/km',''):''}"></div><div class="field"><label>Heart rate (bpm)</label><input id="fhr" value="${d.hr??''}"></div><div class="field"><label>Elevation (m)</label><input id="felev" value="${d.elevation??''}"></div><div class="field"><label>Calories</label><input id="fcal" value="${d.calories??''}"></div><div class="field"><label>Cadence</label><input id="fcad" value="${d.cadence??''}"></div></div><button class="btn" onclick="saveRun()">Save & Coach Me</button></div>`}
function saveRun(){let p=$('fpace').value.trim(),pm=p.includes(':')?(()=>{let a=p.split(':');return +a[0]+(+a[1]/60)})():num(p);let r={id:Date.now(),date:$('fdate').value,distance:num($('fdistance').value),duration:num($('fduration').value),pace:pm,hr:num($('fhr').value),elevation:num($('felev').value),calories:num($('fcal').value),cadence:num($('fcad').value),type:'Running',coach:''};r.coach=coachTake(r);runs.unshift(r);save();toast('Run tersimpan.');tab='coach';render()}
function coachTake(r){let prev=runs[0],s=[];if(r.distance&&r.pace)s.push(`Lari ${r.distance.toFixed(2)} km dengan pace ${paceText(r.pace)}. Pace ini masih bisa jadi patokan, tapi nggak perlu dikejar setiap hari.`);else s.push('Data lari ini belum lengkap, jadi aku cuma baca bagian yang kelihatan.');if(r.hr==null)s.push('Heart rate belum tersedia di screenshot ini.');if(prev&&r.pace&&prev.pace){let diff=r.pace-prev.pace;s.push(diff<-.15?'Kamu lebih cepat dari lari sebelumnya. Bagus, tapi jangan langsung tambah beban besok.':diff>.15?'Pace kali ini lebih pelan. Nggak masalah—bisa jadi badan memang butuh lari santai.':'Pace kamu cukup stabil dibanding lari sebelumnya.');}s.push('Untuk sekarang sudah cukup. Besok lihat kondisi badan dulu sebelum pilih latihan berat.');return s.join('\n\n')}
function activity(r){return `<div class="card activity" onclick="selected=${r.id};tab='history';render()"><div class="between"><span class="tag">${esc(r.type)}</span><span class="sub">${dateLabel(r.date)}</span></div><div class="grid" style="margin-top:10px"><div class="metric"><span>Distance</span><b>${r.distance?r.distance.toFixed(2)+' km':'—'}</b></div><div class="metric"><span>Time</span><b>${r.duration?formatDur(r.duration):'—'}</b></div><div class="metric"><span>Pace</span><b>${paceText(r.pace)}</b></div><div class="metric"><span>Heart rate</span><b>${r.hr?r.hr+' bpm':'—'}</b></div></div></div>`}function formatDur(m){let h=Math.floor(m/60),mm=Math.round(m%60);return h?`${h}h ${mm}m`:`${mm} min`}
function coach(){let r=latest(),d=daily();return `<div class="hero"><div class="sub muted">WHAT SHOULD I DO TODAY?</div><h2>${d.act}</h2><p class="coach">${d.note}</p></div><div class="section"><h3>Coach's take</h3><div class="card coach">${r?esc(r.coach||coachTake(r)):'Data kamu masih sedikit. Upload beberapa screenshot lari dulu, nanti aku bisa baca polanya lebih jelas.'}</div></div><div class="section"><h3>Talk to coach</h3><div id="chatlog" class="card"><div class="coach">Tanya aja soal latihanmu. Aku jawab dari data yang sudah kamu simpan.</div></div><div class="row"><input id="chatinput" class="chatinput" placeholder="Hari ini lari apa?" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Kirim</button></div></div>`}
function ask(){let q=$('chatinput').value.trim();if(!q)return;let answer=chatAnswer(q),log=$('chatlog');log.innerHTML+=`<p><b>Kamu:</b> ${esc(q)}</p><p class="coach"><b>Coach:</b> ${esc(answer)}</p>`;$('chatinput').value=''}function chatAnswer(q){let l=q.toLowerCase(),d=daily(),r=latest();if(/sakit|nyeri|dada|pusing|sesak|pingsan|cedera/.test(l))return 'Kalau ada nyeri dada, pusing berat, sesak, merasa mau pingsan, atau cedera serius: stop latihan dan cari bantuan medis. Jangan dipaksa.';if(/besok|hari ini|latihan apa|lari apa/.test(l))return `${d.act}, sekitar ${d.dur}. ${d.note}`;if(/bagus|tadi/.test(l)&&r)return r.coach||coachTake(r);if(/rest|recovery/.test(l))return d.act.includes('Recovery')||d.act.includes('Rest')?'Iya, hari ini recovery dulu. Jalan santai dan mobility ringan cukup.':'Kalau kaki terasa berat atau energi rendah, pilih recovery. Kalau badan fresh, easy run masih aman.';if(/5k|pace|cepat/.test(l))return 'Untuk ngejar 5K, jangan semua lari dibuat cepat. Bangun easy run dulu, lalu sisipkan satu sesi tempo atau interval per minggu kalau recovery aman.';return 'Aku perlu beberapa screenshot lagi biar bisa baca polanya lebih jelas. Untuk sekarang, ikuti rencana hari ini dan jangan abaikan sinyal badan.'}
function history(){let list=runs.map(r=>selected===r.id?`<div class="card"><button class="btn ghost" onclick="selected=null;render()">← Kembali</button><h2>Your run</h2>${activity(r)}<div class="coach">${esc(r.coach||coachTake(r))}</div>${r.elevation==null?'<p class="muted">Elevation belum tersedia di screenshot ini.</p>':''}</div>`:activity(r)).join('');return `<div class="section"><div class="between"><h2>History</h2><span class="sub">${runs.length} run</span></div>${list||'<div class="card muted">Belum ada riwayat.</div>'}</div>`}
function plan(){return `<div class="section"><h2>My Plan</h2><div class="card"><div class="field"><label>Goal</label><select onchange="settings.goal=this.value;save();render()">${['Konsisten lari','5K','10K','Meningkatkan endurance','Meningkatkan pace','General fitness'].map(x=>`<option ${settings.goal===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Hari latihan per minggu</label><select onchange="settings.days=+this.value;save();render()">${[3,4,5].map(x=>`<option ${settings.days===x?'selected':''}>${x}</option>`).join('')}</select></div></div>${weekPlan()}</div>`}
function weekPlan(){let n=+settings.days,items=n===5?['Easy Run · 30 min','Strength · 20 min','Tempo ringan · 25 min','Easy Run · 30 min','Long Run · 45–55 min']:n===4?['Easy Run · 30 min','Mobility / Strength · 20 min','Easy Run · 35 min','Long Run · 45–50 min']:['Easy Run · 30 min','Mobility ringan','Long Run · 45 min'];let days=['MON','TUE','WED','THU','FRI','SAT','SUN'];return `<div class="card">${days.map((d,i)=>`<div class="between" style="padding:12px 0;border-bottom:1px solid var(--line)"><b>${d}</b><span>${items[i%n]||'Rest'}</span></div>`).join('')}</div><p class="muted">Program ini sengaja dibuat bertahap. Kalau kaki berat, ganti sesi berat jadi easy atau rest.</p>`}
function progress(){let total=runs.reduce((a,r)=>a+(r.distance||0),0),avg=runs.filter(r=>r.pace).length?runs.filter(r=>r.pace).reduce((a,r)=>a+r.pace,0)/runs.filter(r=>r.pace).length:0,long=Math.max(0,...runs.map(r=>r.distance||0));let weeks={};runs.forEach(r=>{let d=new Date(r.date),key=`${d.getFullYear()}-${String(Math.ceil((d.getDate()+new Date(d.getFullYear(),d.getMonth(),1).getDay())/7)).padStart(2,'0')}`;weeks[key]=(weeks[key]||0)+(r.distance||0)});let vals=Object.values(weeks),max=Math.max(1,...vals);return `<div class="section"><h2>Progress</h2><div class="grid"><div class="metric"><span>Total runs</span><b>${runs.length}</b></div><div class="metric"><span>Total distance</span><b>${total.toFixed(1)} km</b></div><div class="metric"><span>Average pace</span><b>${paceText(avg)}</b></div><div class="metric"><span>Longest run</span><b>${long.toFixed(1)} km</b></div></div>${runs.length>=2?`<div class="card"><h3>Distance per week</h3>${Object.entries(weeks).slice(-6).map(([k,v])=>`<p class="between"><span>${k}</span><b>${v.toFixed(1)} km</b></p><div class="bar"><i style="width:${v/max*100}%"></i></div>`).join('')}</div>`:'<div class="card muted">Upload minimal dua lari untuk mulai melihat tren.</div>'}</div>`}
function render(){let content=tab==='home'?home():tab==='coach'?coach():tab==='plan'?plan():tab==='history'?history():progress();$('main').innerHTML=content;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(!document.querySelector('.nav'))document.body.insertAdjacentHTML('beforeend',`<nav class="nav">${[['home','⌂','Home'],['coach','✦','Coach'],['plan','▦','Plan'],['history','◷','History'],['progress','↗','Progress']].map(x=>`<button data-tab="${x[0]}" onclick="tab='${x[0]}';selected=null;render()"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){} }
if(sessionStorage.ok==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');init()}
</script></body></html>
